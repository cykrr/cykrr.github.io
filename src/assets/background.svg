<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" fill="none">
  <defs>
    <!-- Sky gradient: predominant #ACF6FB → deep night (using sky-cyan from image) -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ACF6FB" stop-opacity="0.08"/>
      <stop offset="15%" stop-color="#ACF6FB" stop-opacity="0.04"/>
      <stop offset="40%" stop-color="#0a1a2e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="1"/>
    </linearGradient>

    <!-- Lum's sky glow (predominant #ACF6FB) -->
    <radialGradient id="skyGlow" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ACF6FB" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#ACF6FB" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ACF6FB" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold glow (from Lum's horns #FBEAAA) -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBEAAA" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FBEAAA" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink glow (from outfit #E56798) -->
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E56798" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E56798" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night sky with predominant #ACF6FB at top -->
  <rect width="1440" height="1024" fill="url(#skyGrad)"/>
  <rect width="1440" height="1024" fill="url(#skyGlow)"/>

  <!-- Subtle periwinkle stripes (#AAA0DB from image) -->
  <g opacity="0.02">
    <path d="M0 200 L1440 150" stroke="#AAA0DB" stroke-width="40"/>
    <path d="M0 250 L1440 200" stroke="#CDCFF0" stroke-width="30"/>
    <path d="M0 500 L1440 450" stroke="#AAA0DB" stroke-width="35"/>
    <path d="M0 550 L1440 500" stroke="#CDCFF0" stroke-width="25"/>
    <path d="M0 800 L1440 750" stroke="#AAA0DB" stroke-width="30"/>
    <path d="M0 850 L1440 800" stroke="#CDCFF0" stroke-width="20"/>
  </g>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="80" r="2" opacity="0.9"/>
    <circle cx="320" cy="150" r="1.5" opacity="0.7"/>
    <circle cx="550" cy="60" r="2.5" opacity="0.8"/>
    <circle cx="780" cy="120" r="1.8" opacity="0.9"/>
    <circle cx="950" cy="50" r="2" opacity="0.7"/>
    <circle cx="1150" cy="180" r="1.5" opacity="0.6"/>
    <circle cx="1350" cy="90" r="2.2" opacity="0.8"/>
    <circle cx="200" cy="300" r="1.2" opacity="0.5"/>
    <circle cx="450" cy="250" r="1.8" opacity="0.7"/>
    <circle cx="680" cy="350" r="1" opacity="0.4"/>
    <circle cx="900" cy="280" r="1.5" opacity="0.6"/>
    <circle cx="1100" cy="400" r="1.2" opacity="0.5"/>
    <circle cx="1300" cy="320" r="2" opacity="0.7"/>
    <circle cx="80" cy="450" r="1.5" opacity="0.5"/>
    <circle cx="350" cy="500" r="1" opacity="0.4"/>
    <circle cx="600" cy="450" r="1.8" opacity="0.6"/>
    <circle cx="850" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="1050" cy="480" r="1.5" opacity="0.4"/>
    <circle cx="1400" cy="550" r="1" opacity="0.5"/>
    <circle cx="150" cy="600" r="1.8" opacity="0.6"/>
    <circle cx="400" cy="650" r="1.2" opacity="0.4"/>
    <circle cx="700" cy="600" r="2" opacity="0.7"/>
    <circle cx="1000" cy="680" r="1.5" opacity="0.5"/>
    <circle cx="1250" cy="620" r="1" opacity="0.4"/>
    <circle cx="50" cy="750" r="1.5" opacity="0.5"/>
    <circle cx="300" cy="800" r="1" opacity="0.3"/>
    <circle cx="500" cy="750" r="2.2" opacity="0.6"/>
    <circle cx="750" cy="820" r="1.5" opacity="0.5"/>
    <circle cx="950" cy="780" r="1" opacity="0.4"/>
    <circle cx="1200" cy="850" r="1.8" opacity="0.6"/>
    <circle cx="1380" cy="750" r="1.2" opacity="0.4"/>
  </g>

  <!-- Star sparkles in sky cyan #ACF6FB & gold #FBEAAA -->
  <g fill="#ACF6FB" opacity="0.5">
    <path d="M520 100 L522 108 L530 110 L522 112 L520 120 L518 112 L510 110 L518 108 Z"/>
    <path d="M1020 200 L1022 208 L1030 210 L1022 212 L1020 220 L1018 212 L1010 210 L1018 208 Z"/>
  </g>
  <g fill="#FBEAAA" opacity="0.5">
    <path d="M200 180 L202 186 L208 188 L202 190 L200 196 L198 190 L192 188 L198 186 Z"/>
    <path d="M820 400 L822 408 L830 410 L822 412 L820 420 L818 412 L810 410 L818 408 Z"/>
  </g>

  <!-- Lightning bolt 1 (left) — sky cyan #ACF6FB -->
  <g filter="url(#glow)">
    <path d="M250 100 L220 300 L260 300 L230 500 L310 280 L270 280 L300 100 Z" 
          fill="#ACF6FB" opacity="0.08"/>
    <path d="M255 120 L230 290 L265 290 L240 470 L300 285 L268 285 L292 120 Z" 
          fill="#ACF6FB" opacity="0.12"/>
  </g>

  <!-- Lightning bolt 2 (right) — pink #E56798 -->
  <g filter="url(#glow)">
    <path d="M1150 200 L1130 380 L1155 380 L1140 520 L1195 380 L1165 380 L1175 200 Z" 
          fill="#E56798" opacity="0.08"/>
    <path d="M1153 220 L1138 370 L1158 370 L1146 500 L1188 375 L1167 375 L1172 220 Z" 
          fill="#E56798" opacity="0.1"/>
  </g>

  <!-- Gold glow from Lum's horns -->
  <circle cx="250" cy="150" r="200" fill="url(#goldGlow)"/>
  <circle cx="700" cy="600" r="250" fill="url(#goldGlow)"/>

  <!-- Pink glow from outfit -->
  <circle cx="1100" cy="180" r="180" fill="url(#pinkGlow)"/>
  <circle cx="400" cy="800" r="200" fill="url(#pinkGlow)"/>

  <!-- Electric arc lines in periwinkle -->
  <g stroke="#AAA0DB" stroke-width="0.5" opacity="0.06" fill="none">
    <path d="M100 200 Q200 180 300 220 Q400 260 500 200"/>
    <path d="M800 100 Q900 140 1000 100 Q1100 60 1200 120"/>
    <path d="M600 400 Q700 380 800 420 Q900 460 1000 400"/>
  </g>

  <!-- Pixel heart in rose #DF5177 -->
  <g transform="translate(680, 480)" opacity="0.06">
    <rect x="4" y="0" width="4" height="4" fill="#DF5177"/>
    <rect x="12" y="0" width="4" height="4" fill="#DF5177"/>
    <rect x="0" y="4" width="4" height="4" fill="#DF5177"/>
    <rect x="8" y="4" width="4" height="4" fill="#DF5177"/>
    <rect x="16" y="4" width="4" height="4" fill="#DF5177"/>
    <rect x="0" y="8" width="4" height="4" fill="#DF5177"/>
    <rect x="4" y="8" width="4" height="4" fill="#DF5177"/>
    <rect x="12" y="8" width="4" height="4" fill="#DF5177"/>
    <rect x="16" y="8" width="4" height="4" fill="#DF5177"/>
    <rect x="2" y="12" width="4" height="4" fill="#DF5177"/>
    <rect x="14" y="12" width="4" height="4" fill="#DF5177"/>
    <rect x="4" y="16" width="4" height="4" fill="#DF5177"/>
    <rect x="12" y="16" width="4" height="4" fill="#DF5177"/>
    <rect x="8" y="20" width="4" height="4" fill="#DF5177"/>
  </g>
</svg>
